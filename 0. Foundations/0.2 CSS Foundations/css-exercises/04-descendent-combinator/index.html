<!DOCTYPE html>

<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="styles.css">
        <title>Descendent Combinator</title>
    </head>
    <body>
        <div class="parent">
            <p class="child">This is a paragraph inside the parent div.</p>
        </div>
        <p>This is a paragraph outside the parent div.</p>
        <p>This is another paragraph outside the parent div.</p>
        <div class="parent">
            <p class="child">This is another paragraph inside the parent div.</p>
            <p class="child">This is yet another paragraph inside the parent div.</p>
        </div>
    </body>
</html>
