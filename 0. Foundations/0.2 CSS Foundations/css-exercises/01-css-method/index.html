<!DOCTYPE html>
<!--In this exercise, you're going to practice adding CSS to an HTML file using all three methods: external CSS, internal CSS, and inline CSS. You should only be using type selectors for this exercise when adding styles via the external and internal methods. -->

<html lang="en">
    <head>
        <link rel="stylesheet" href="styles.css">
        <style>
            p {
                color: white;
                background-color: green;
            }
        </style>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Learning CSS</title>
    </head>
    <body>
        <div>
        <h1>Style me via the external method</h1>
        </div>
        <p>I would like to be styled via the internal method please</p>
        <button style="color: black; background-color: orange;">Inline Method</button>
    </body>
</html>
