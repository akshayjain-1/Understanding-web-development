<!-- To do: Create a calculator interface with HTML, style it with CSS, and add functionality with JavaScript -->
 <!DOCTYPE html>

 <html lang="en">
    <head>
        <meta charset="utf-8">
        <title>Calculator</title>
        <script src="script.js" defer></script>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="calculator">
            <div class="display" contenteditable="true"></div>
            <div class="layout">
                <button class="button function-button-1" id="backspace">&larr;</button>
                <button class="button function-button-1" id="clear">C</button>
                <button class="button function-button-1" id="percent">%</button>
                <button class="button function-button-2" id="divide">&divide;</button>
                <button class="button" id="seven">7</button>
                <button class="button" id="eight">8</button>
                <button class="button" id="nine">9</button>
                <button class="button function-button-2" id="multiply">&times;</button>
                <button class="button" id="four">4</button>
                <button class="button" id="five">5</button>
                <button class="button" id="six">6</button>
                <button class="button function-button-2" id="subtract">-</button>
                <button class="button" id="one">1</button>
                <button class="button" id="two">2</button>
                <button class="button" id="three">3</button>
                <button class="button function-button-2" id="add">+</button>
                <button class="button" id="negate">±</button>
                <button class="button" id="zero">0</button>
                <button class="button" id="decimal">.</button>
                <button class="button function-button-2" id="equals">=</button>
            </div>
        </div>
    </body>
 </html>
